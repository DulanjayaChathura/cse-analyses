<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSE share analyses</title>
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">CSE share analyses <span>Colombo Stock Exchange</span></a>
    <button class="theme-toggle" type="button">Dark mode</button>
  </header>

  <main class="page">
    <div class="home-head">
      <div>
        <h1>Companies</h1>
        <p id="updated">Loading…</p>
      </div>
      <input class="search" id="search" type="search" placeholder="Search by name or code" aria-label="Search companies">
    </div>
    <div id="notice"></div>
    <div class="cards" id="cards"></div>
  </main>

  <footer class="footer">
    Personal analysis, not financial advice. Interim figures may be unaudited. Prices are daily closes from the Colombo Stock Exchange website and may be delayed or missing.
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
