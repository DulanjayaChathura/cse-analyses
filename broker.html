<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broker updates</title>
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline pathLength="1" points="3,17 9,11 13,14 21,6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polyline pathLength="1" points="15,6 21,6 21,12" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>CSE share analyses <span>Colombo Stock Exchange</span></a>
    <nav class="topnav"><a href="./"><span class="nav-ic" aria-hidden="true">🏢</span>Companies</a><a href="broker.html" class="active"><span class="nav-ic" aria-hidden="true">🗞️</span>Broker updates</a></nav>
    <button class="theme-toggle" type="button">Dark mode</button>
  </header>

  <main class="page">
    <!-- Day picker: arrows move between the saved days. -->
    <div class="home-head bk-banner">
      <svg class="bk-bg" viewBox="0 0 600 140" preserveAspectRatio="none" aria-hidden="true">
        <polyline class="bk-bg-l1" pathLength="1" fill="none" points="0,110 40,96 80,104 120,80 160,88 200,62 240,70 280,52 320,66 360,40 400,48 440,30 480,42 520,22 560,30 600,14"/>
        <polyline class="bk-bg-l2" pathLength="1" fill="none" points="0,124 50,118 100,122 150,104 200,110 250,92 300,98 350,84 400,90 450,72 500,80 550,64 600,70"/>
        <g class="bk-bg-bars"><rect x="20" y="118" width="14" height="22" rx="2"/><rect x="50" y="106" width="14" height="34" rx="2"/><rect x="80" y="122" width="14" height="18" rx="2"/><rect x="110" y="100" width="14" height="40" rx="2"/><rect x="140" y="112" width="14" height="28" rx="2"/><rect x="170" y="94" width="14" height="46" rx="2"/><rect x="200" y="110" width="14" height="30" rx="2"/><rect x="230" y="88" width="14" height="52" rx="2"/><rect x="260" y="102" width="14" height="38" rx="2"/><rect x="290" y="82" width="14" height="58" rx="2"/><rect x="320" y="98" width="14" height="42" rx="2"/><rect x="350" y="76" width="14" height="64" rx="2"/><rect x="380" y="92" width="14" height="48" rx="2"/><rect x="410" y="70" width="14" height="70" rx="2"/><rect x="440" y="86" width="14" height="54" rx="2"/><rect x="470" y="64" width="14" height="76" rx="2"/><rect x="500" y="80" width="14" height="60" rx="2"/><rect x="530" y="58" width="14" height="82" rx="2"/><rect x="560" y="74" width="14" height="66" rx="2"/></g>
      </svg>
      <div>
        <h1><span class="bk-h-ic" aria-hidden="true">📰</span>Broker updates</h1>
        <p id="sub">Loading…</p>
      </div>
      <div class="daynav">
        <button type="button" id="prev" aria-label="Earlier day">‹</button>
        <select id="day" aria-label="Choose a day"></select>
        <button type="button" id="next" aria-label="Later day">›</button>
      </div>
    </div>

    <div id="content"></div>
  </main>

  <footer class="footer">
    A summary of broker messages, not financial advice. Broker figures are read from their images and may contain small errors; targets are the broker's own 12-month price targets.
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/broker.js"></script>
</body>
</html>
