# Saves the day's posts from the Telegram channel (for example, broker
# messages forwarded from WhatsApp) into inbox/, ready for the daily summary.
# Runs every day at 20:45 Sri Lanka time, ahead of the 21:00 summary,
# and whenever you press "Run workflow" on the Actions tab.
name: Collect broker messages

on:
  schedule:
    # 15:15 UTC = 20:45 in Sri Lanka, every day.
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write   # save the messages into inbox/

concurrency:
  group: broker-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Save new channel posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/broker_collect.py

      # "[skip ci]" stops this commit from rebuilding the site; the site is
      # rebuilt when the summary itself is added to broker/.
      - name: Commit the saved posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox
          if ! git diff --cached --quiet; then
            git commit -m "Collect broker messages [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
